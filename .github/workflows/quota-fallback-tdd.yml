name: Quota Fallback TDD

on:
  push:
    branches:
      - work/codex-opencode-fallback-design

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Focused fallback tests
        run: |
          bun run test packages/workflows/src/provider-fallback.test.ts packages/workflows/src/run-config.test.ts packages/core/src/config/run-config.test.ts
