name: F16 Archon Baseline Qualification

on:
  push:
    branches:
      - qualification/f16-opencode-baseline

env:
  BUN_VERSION: '1.4.2'

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run existing OpenCode provider tests
        run: bun test packages/providers/src/community/opencode/provider.test.ts
      - name: Type check baseline
        run: bun run type-check
