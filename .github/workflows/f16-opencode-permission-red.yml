name: F16 OpenCode Permission RED

on:
  push:
    branches:
      - qualification/f16-opencode-permission-red

env:
  BUN_VERSION: '1.4.2'

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run focused OpenCode provider regression
        run: bun test packages/providers/src/community/opencode/provider.test.ts
